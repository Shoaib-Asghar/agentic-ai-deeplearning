[project]
name = "agentic-ai-learning"
version = "0.1.0"
description = "First-principles implementations of DeepLearning.AI's Agentic AI course workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.1.0",
    "google-genai>=2.0.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "rich>=13.8.0",
    "tavily-python>=0.5.0",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "pyright>=1.1.414",
    "pytest>=8.0.0",
]

[tool.uv]
managed = true
package = false

[tool.pyright]
extraPaths = ["01_reflective_research_agent"]


